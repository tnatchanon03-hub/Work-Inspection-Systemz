<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>แจ้ง Defect</title>
<style>
:root{
  --bg:#f6f6f7; --surface:#ffffff; --text:#1d1d1f; --muted:#6b6b70; --line:#e2e2e6;
  --red:#c62828; --red-bg:#fdecea; --red-line:#f1b5b0;
  --amber:#8a5200; --amber-bg:#fff3dc;
  --blue:#1b5fb4; --blue-bg:#e8f1fd;
  --gray:#5b5b61; --gray-bg:#efeff1;
  --ok:#1b7f3b; --ok-bg:#e5f5ea;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101012; --surface:#1b1b1e; --text:#f2f2f3; --muted:#a2a2a9; --line:#34343a;
    --red:#ff8f86; --red-bg:#3b1f1d; --red-line:#7a3a35;
    --amber:#ffcf7a; --amber-bg:#3a2d12;
    --blue:#8ab8f5; --blue-bg:#16263d;
    --gray:#b8b8bf; --gray-bg:#2a2a2e;
    --ok:#7fdc9a; --ok-bg:#16301f;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Noto Sans Myanmar","Noto Sans Khmer",sans-serif;
  -webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:520px;margin:0 auto;padding:0 0 24px}
header{background:var(--red-bg);color:var(--red);padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--red-line)}
header h1{margin:0;font-size:18px;font-weight:600}
header .who{font-size:13px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:45%}
main{padding:16px}
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input[type=text],select{width:100%;min-height:48px;padding:10px 12px;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;font-family:inherit}
input[type=text]:focus,select:focus{outline:2px solid var(--red);outline-offset:1px}
.err{min-height:18px;margin-top:4px;font-size:13px;color:var(--red)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.urg{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font-family:inherit;color:var(--text);
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;min-height:56px;cursor:pointer}
.urg[aria-checked="true"]{border:2px solid var(--red);padding:11px}
.dot{flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.u1 .dot{background:var(--red-bg);color:var(--red)}
.u2 .dot{background:var(--amber-bg);color:var(--amber)}
.u3 .dot{background:var(--blue-bg);color:var(--blue)}
.u4 .dot{background:var(--gray-bg);color:var(--gray)}
.urg b{display:block;font-size:15px;font-weight:600}
.urg span.h{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.callout{display:none;margin:4px 0 10px;padding:10px 12px;border-radius:10px;background:var(--red-bg);color:var(--red);font-size:14px}
.callout.on{display:block}
button.go{width:100%;min-height:52px;margin-top:10px;font-size:17px;font-weight:600;font-family:inherit;border-radius:12px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer}
@media (prefers-color-scheme: dark){button.go{color:#2a0d0b;background:var(--red)}}
button.go:disabled{opacity:.55;cursor:default}
button.ghost{width:100%;min-height:48px;margin-top:10px;font-size:16px;font-family:inherit;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
.banner{display:none;margin:0 0 12px;padding:10px 12px;border-radius:10px;font-size:14px}
.banner.err-b{display:block;background:var(--red-bg);color:var(--red)}
.banner.warn-b{display:block;background:var(--amber-bg);color:var(--amber)}
.done{text-align:center;padding:36px 16px}
.done .tick{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px}
.done .id{font-size:24px;font-weight:700;margin:6px 0}
.done p{color:var(--muted);font-size:14px;margin:6px 0}
.hide{display:none}
.center{text-align:center;padding:48px 16px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="ttl">แจ้ง Defect</h1><div class="who" id="who"></div></header>
  <main>
    <div id="boot" class="center">...</div>

    <form id="form" class="hide" novalidate onsubmit="return false">
      <div id="banner" class="banner"></div>

      <label class="f" for="loc" id="l_loc"></label>
      <input id="loc" type="text" maxlength="120" autocomplete="off" enterkeyhint="next">
      <div class="err" id="e_loc"></div>

      <label class="f" for="work" id="l_work"></label>
      <input id="work" type="text" maxlength="200" autocomplete="off" enterkeyhint="next">
      <div class="err" id="e_work"></div>

      <label class="f" for="crew" id="l_crew"></label>
      <select id="crew"></select>
      <div class="err" id="e_crew"></div>

      <label class="f" for="sup" id="l_sup"></label>
      <select id="sup"></select>
      <div class="err" id="e_sup"></div>

      <label class="f" id="l_urg"></label>
      <div id="urgList" role="radiogroup" aria-labelledby="l_urg"></div>
      <div class="callout" id="callout"></div>
      <div class="err" id="e_urg"></div>

      <button class="go" id="send" type="button"></button>
    </form>

    <section id="done" class="done hide">
      <div class="tick">&#10003;</div>
      <div class="id" id="doneId"></div>
      <p id="doneMsg"></p>
      <p id="doneWarn" class="hide"></p>
      <button class="ghost" id="closeBtn" type="button"></button>
    </section>
  </main>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ===================== ตั้งค่า (แก้ 3 จุดนี้) ===================== */
const CONFIG = {
  LIFF_ID:  '2012189042-jm1zJsWr',
  ENDPOINT: 'https://hook.us2.make.com/5l6eixe9qfg97jm6l6k2fq75pnkoxi77',
  /* รายชื่อสำรอง ใช้เมื่อโหลดรายชื่อจากชีตไม่ได้
     ปกติฟอร์มดึงรายชื่อล่าสุดจากชีต (แท็บ Crews และ Users) เอง เพิ่มคนในชีตได้เลยโดยไม่ต้องแก้ไฟล์นี้ */
  CREWS:       ['ช่างม่อน', 'ช่างซอ', 'ช่างเทียร์', 'ช่างเหล็ก', 'ช่างมานะ'],
  SUPERVISORS: ['ช่างโต้ง', 'ช่างนน', 'ช่างเทียน', 'ช่างเอี่ยว']
};

/* ===================== ข้อความหลายภาษา =====================
   ภาษาที่ยังไม่เติมจะใช้อังกฤษแทน
   ภาษาพม่า (my) และเขมร (km) ให้เติมหลังหัวหน้าชุดตรวจคำแปลแล้วเท่านั้น */
const T = {
  th: {
    title:'แจ้ง Defect', loc:'ตำแหน่ง', locPh:'เช่น คาน B3 ชั้น 2', work:'งาน', workPh:'เช่น เหล็กปลอกไม่ครบ',
    crew:'ชุดรับผิดชอบ', crewPh:'เลือกชุด', sup:'ผู้ดูแล', supPh:'เลือกผู้ดูแล', urg:'ความเร่งด่วน', send:'ส่ง', sending:'กำลังส่ง...',
    needLoc:'ใส่ตำแหน่ง', needWork:'ใส่งานที่ต้องแก้', needCrew:'เลือกชุด', needSup:'เลือกผู้ดูแล', needUrg:'เลือกความเร่งด่วน',
    u1:'หยุดแล้วแก้ทันที', u1h:'เสี่ยงความปลอดภัยหรือโครงสร้าง ห้ามทำงานต่อในจุดนี้',
    u2:'แก้ใน 24 ชั่วโมง', u2h:'ขวางงานถัดไปในสัปดาห์นี้',
    u3:'แก้ใน 3 วัน', u3h:'ไม่ขวางงาน แต่ต้องแก้',
    u4:'เก็บงานท้าย', u4h:'แก้หลังปิด Defect อื่นครบ ก่อนส่งมอบ',
    call1:'ระดับ 1: โทรแจ้งวิศวกรทันทีด้วย อย่ารอแค่ข้อความในไลน์',
    ok:'บันทึกแล้ว', okMsg:'ส่งเข้ากลุ่มแล้ว ถ่ายรูปจุดที่บกพร่องแล้วส่งในกลุ่มพร้อมเลขที่ด้านบน',
    okNoChat:'บันทึกแล้ว แต่ส่งข้อความเข้ากลุ่มไม่ได้ ให้พิมพ์เลขที่นี้ในกลุ่มเอง',
    close:'ปิด', errNet:'ส่งไม่สำเร็จ ลองอีกครั้ง', errAuth:'ยังไม่ได้รับสิทธิ์ใช้ฟอร์มนี้ ติดต่อผู้ดูแล',
    errLogin:'เปิดฟอร์มจากลิงก์ในกลุ่มไลน์เท่านั้น', errCfg:'ยังไม่ได้ตั้งค่าฟอร์ม (LIFF ID / Endpoint)'
  },
  en: {
    title:'Report a defect', loc:'Location', locPh:'e.g. Beam B3, level 2', work:'Work / problem', workPh:'e.g. Stirrups missing',
    crew:'Responsible crew', crewPh:'Select crew', sup:'Supervisor (follows up)', supPh:'Select supervisor', urg:'Urgency', send:'Send', sending:'Sending...',
    needLoc:'Enter the location', needWork:'Enter the problem', needCrew:'Select a crew', needSup:'Select a supervisor', needUrg:'Select urgency',
    u1:'Stop and fix now', u1h:'Safety or structural risk. Do not continue work here',
    u2:'Fix within 24 hours', u2h:'Blocks the next work this week',
    u3:'Fix within 3 days', u3h:'Does not block work, but must be fixed',
    u4:'Punch list', u4h:'Fix after other defects are closed, before handover',
    call1:'Level 1: also call the engineer right away. Do not rely on the chat message only',
    ok:'Saved', okMsg:'Posted to the group. Take a photo of the defect and send it in the group with the number above',
    okNoChat:'Saved, but the group message could not be sent. Type this number in the group yourself',
    close:'Close', errNet:'Could not send. Try again', errAuth:'You do not have access to this form. Contact the admin',
    errLogin:'Open this form from the link in the LINE group', errCfg:'Form is not configured (LIFF ID / Endpoint)'
  },
  my: {}, km: {}
};
const URG = [
  {n:1, k:'u1'}, {n:2, k:'u2'}, {n:3, k:'u3'}, {n:4, k:'u4'}
];

let lang = 'th', sel = -1, sending = false, requestId = null, profile = null;
const $ = id => document.getElementById(id);
const t = k => (T[lang] && T[lang][k]) || T.en[k] || T.th[k] || k;

function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function fillSelect(el, list, placeholder){
  const cur = el.value;
  el.innerHTML = '<option value="">' + placeholder + '</option>' +
    list.map(c => '<option>' + String(c).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</option>').join('');
  if (list.indexOf(cur) > -1) el.value = cur;
}

function applyText(){
  document.documentElement.lang = lang;
  document.title = t('title'); $('ttl').textContent = t('title');
  $('l_loc').textContent = t('loc'); $('loc').placeholder = t('locPh');
  $('l_work').textContent = t('work'); $('work').placeholder = t('workPh');
  $('l_crew').textContent = t('crew'); $('l_urg').textContent = t('urg');
  $('send').textContent = sending ? t('sending') : t('send');
  $('closeBtn').textContent = t('close');
  $('l_sup').textContent = t('sup');
  fillSelect($('crew'), CONFIG.CREWS, t('crewPh'));
  fillSelect($('sup'), CONFIG.SUPERVISORS, t('supPh'));
  drawUrg();
}

function drawUrg(){
  $('urgList').innerHTML = URG.map((u, i) =>
    '<button type="button" class="urg u' + u.n + '" role="radio" aria-checked="' + (sel === i) + '" data-i="' + i + '">' +
    '<div class="dot">' + u.n + '</div><div><b>' + t(u.k) + '</b><span class="h">' + t(u.k + 'h') + '</span></div></button>'
  ).join('');
  const c = $('callout');
  c.textContent = t('call1'); c.classList.toggle('on', sel === 0);
}

$('urgList').addEventListener('click', e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  sel = Number(b.dataset.i); $('e_urg').textContent = ''; drawUrg();
});
['loc','work'].forEach(id => $(id).addEventListener('input', () => $('e_' + id).textContent = ''));
$('crew').addEventListener('change', () => $('e_crew').textContent = '');
$('sup').addEventListener('change', () => $('e_sup').textContent = '');

function banner(kind, msg){
  const b = $('banner'); b.className = 'banner' + (kind ? ' ' + kind : ''); b.textContent = msg || '';
}

function validate(){
  let ok = true;
  if (!$('loc').value.trim())  { $('e_loc').textContent = t('needLoc'); ok = false; }
  if (!$('work').value.trim()) { $('e_work').textContent = t('needWork'); ok = false; }
  if (!$('crew').value)        { $('e_crew').textContent = t('needCrew'); ok = false; }
  if (!$('sup').value)         { $('e_sup').textContent = t('needSup'); ok = false; }
  if (sel < 0)                 { $('e_urg').textContent = t('needUrg'); ok = false; }
  return ok;
}

async function submit(){
  if (sending) return;
  banner('', '');
  if (!validate()) return;
  const idToken = liff.getIDToken();
  if (!idToken){ liff.login(); return; }

  sending = true; $('send').disabled = true; $('send').textContent = t('sending');
  if (!requestId) requestId = uuid();

  const loc = $('loc').value.trim(), work = $('work').value.trim(), crew = $('crew').value, sup = $('sup').value;
  const u = URG[sel];
  const payload = {
    action: 'submit', requestId, idToken, loc, work, crew, supervisor: sup,
    urgency: u.n, urgencyText: T.th[u.k],
    lang, sentAt: new Date().toISOString()
  };

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    /* text/plain เพื่อเลี่ยง CORS preflight; Make ต้องตอบกลับพร้อม header Access-Control-Allow-Origin */
    const res = await fetch(CONFIG.ENDPOINT, {
      method: 'POST', headers: {'Content-Type': 'text/plain;charset=UTF-8'},
      body: JSON.stringify(payload), signal: ctrl.signal
    });
    let data = null;
    try { data = await res.json(); } catch (_) {}
    if (res.status === 401 || res.status === 403) throw new Error('auth');
    if (!res.ok || !data || !data.ok || !data.id) throw new Error('server');

    let sentToChat = false;
    try {
      const type = (liff.getContext() || {}).type;
      if (liff.isInClient() && type && type !== 'none' && liff.isApiAvailable('sendMessages')) {
        await liff.sendMessages([{
          type: 'text',
          text: 'แจ้ง Defect ' + data.id + ' | ' + loc + ' | ' + work + ' | ' + crew + ' | ผู้ดูแล ' + sup + ' | ' + T.th[u.k]
        }]);
        sentToChat = true;
      }
    } catch (_) { sentToChat = false; }

    $('form').classList.add('hide'); $('done').classList.remove('hide');
    $('doneId').textContent = data.id;
    $('doneMsg').textContent = t(sentToChat ? 'okMsg' : 'okNoChat');
    $('ttl').textContent = t('ok');
    if (sentToChat) setTimeout(() => { try { liff.closeWindow(); } catch (_) {} }, 4000);
  } catch (err) {
    banner('err-b', err && err.message === 'auth' ? t('errAuth') : t('errNet'));
    sending = false; $('send').disabled = false; $('send').textContent = t('send');
  } finally { clearTimeout(timer); }
}

$('send').addEventListener('click', submit);
$('closeBtn').addEventListener('click', () => {
  try { if (liff.isInClient()) { liff.closeWindow(); return; } } catch (_) {}
  window.close();
});

/* ดึงรายชื่อชุดและผู้ดูแลล่าสุดจากชีตผ่าน Make (ต้องตรวจตัวตนก่อน) ถ้าไม่ได้ ใช้รายชื่อสำรองใน CONFIG */
async function loadLists(){
  const idToken = liff.getIDToken(); if (!idToken) return;
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(CONFIG.ENDPOINT, {
      method: 'POST', headers: {'Content-Type': 'text/plain;charset=UTF-8'},
      body: JSON.stringify({action: 'lists', idToken}), signal: ctrl.signal
    });
    if (res.status === 401 || res.status === 403){
      banner('err-b', t('errAuth')); $('send').disabled = true; return;
    }
    const d = await res.json();
    if (d && d.ok){
      if (Array.isArray(d.crews) && d.crews.length) CONFIG.CREWS = d.crews.map(String);
      if (Array.isArray(d.supervisors) && d.supervisors.length) CONFIG.SUPERVISORS = d.supervisors.map(String);
      applyText();
    }
  } catch (_) { /* ใช้รายชื่อสำรอง */ }
  finally { clearTimeout(timer); }
}

async function boot(){
  if (/^ใส่/.test(CONFIG.LIFF_ID) || /^ใส่/.test(CONFIG.ENDPOINT)){
    $('boot').textContent = t('errCfg'); return;
  }
  try {
    await liff.init({liffId: CONFIG.LIFF_ID});
    if (!liff.isLoggedIn()){ liff.login(); return; }
    const l = String(liff.getLanguage() || 'th').slice(0, 2);
    lang = T[l] ? l : 'en';
    try { profile = await liff.getProfile(); $('who').textContent = profile.displayName || ''; } catch (_) {}
    applyText();
    $('boot').classList.add('hide'); $('form').classList.remove('hide');
    loadLists();
  } catch (e) {
    $('boot').textContent = t('errLogin');
  }
}
boot();
</script>
</body>
</html>
